<title>Brand Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 대화(설명하기) · 오른쪽 결과 패널(위치·검토·근거·다음 행동). 좁은 화면에선 위아래로 쌓여요. */
:root{
  --bg:#FFFFFF; --panel:#F4F7FA; --raise:#FFFFFF;
  --ink:#111A22; --ink-2:#3E4C59; --muted:#687786; --hair:#E0E7EE; --hair-2:#C9D4DE;
  --accent:#0090E6; --accent-ink:#FFFFFF; --accent-soft:#E5F4FD;
  --ok:#0B7F55; --ok-bg:#E7F5EE; --warn:#9A5B00; --warn-bg:#FBF1E1; --bad:#C2271D; --bad-bg:#FCEBEA;
  --info:#46566A; --info-bg:#EDF1F5;
  --shadow:0 1px 2px rgba(17,26,34,.05),0 12px 32px rgba(17,26,34,.10);
  --scrim:rgba(17,26,34,.38);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1419; --panel:#141C23; --raise:#1A242D;
  --ink:#E6EDF3; --ink-2:#B4C1CD; --muted:#8696A5; --hair:#24313C; --hair-2:#33424F;
  --accent:#3DB2FF; --accent-ink:#06121B; --accent-soft:#11293A;
  --ok:#4CC995; --ok-bg:#0F2A20; --warn:#E6A848; --warn-bg:#2E2412; --bad:#FF7A70; --bad-bg:#33171A;
  --info:#A8B6C4; --info-bg:#1E2933;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1419; --panel:#141C23; --raise:#1A242D;
  --ink:#E6EDF3; --ink-2:#B4C1CD; --muted:#8696A5; --hair:#24313C; --hair-2:#33424F;
  --accent:#3DB2FF; --accent-ink:#06121B; --accent-soft:#11293A;
  --ok:#4CC995; --ok-bg:#0F2A20; --warn:#E6A848; --warn-bg:#2E2412; --bad:#FF7A70; --bad-bg:#33171A;
  --info:#A8B6C4; --info-bg:#1E2933;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}

.shell{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--hair);background:var(--bg)}
.top h1{font-size:16px;font-weight:700}
.top .sub{color:var(--muted);font-size:13px}
.proto{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:999px}
.ghost{background:none;border:1px solid var(--hair-2);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.ghost:hover{border-color:var(--ink-2)}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--hair)}
.thread{flex:1;min-height:0;overflow:auto;padding:24px 24px 12px;display:flex;flex-direction:column;gap:18px}
.msg{max-width:560px;display:flex;flex-direction:column;gap:8px}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.user .bubble{background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap}
.msg.bot .who{font-size:12px;font-weight:600;color:var(--muted)}
.msg.bot .text{color:var(--ink);white-space:pre-line}
.msg.bot .text b{font-weight:600}
.msg.bot .text.typing{color:var(--muted)}
.known{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.known span.k{background:var(--panel);border:1px solid var(--hair);color:var(--ink-2);padding:2px 8px;border-radius:999px}
.replies{display:flex;flex-wrap:wrap;gap:8px}
.reply{background:var(--raise);border:1px solid var(--hair-2);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;text-align:left}
.reply:hover{border-color:var(--accent);color:var(--accent)}
.reply.ex{border-radius:10px;font-size:13.5px;color:var(--ink-2)}
.replies[aria-disabled="true"] .reply{opacity:.45;pointer-events:none}
.composer{padding:12px 24px 18px;border-top:1px solid var(--hair);display:flex;gap:10px;align-items:flex-end;background:var(--bg)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--hair-2);border-radius:12px;padding:10px 14px;background:var(--raise);min-height:46px;max-height:160px;line-height:1.5}
.composer textarea:focus{outline:none;border-color:var(--accent)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.card{background:var(--raise);color:var(--ink);border:1px solid var(--hair-2)}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}

.panel{min-height:0;overflow:auto;background:var(--panel);padding:24px}
.panel-inner{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--raise);border:1px solid var(--hair);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-h h2{font-size:14px;font-weight:700}
.sec-h .right{margin-left:auto}
.eyebrow{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.empty{border:1px dashed var(--hair-2);border-radius:14px;padding:28px;color:var(--muted);display:flex;flex-direction:column;gap:14px}
.empty h2{color:var(--ink);font-size:16px}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.fix,.pill.check,.pill.review{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)} .pill.none,.pill.info,.pill.no{color:var(--info);background:var(--info-bg)}
.pill.yes{color:var(--accent-ink);background:var(--accent)} .pill.tent{color:var(--warn);background:transparent;border:1px dashed var(--warn)}
.pill.rule{color:var(--ink-2);background:var(--panel);border:1px solid var(--hair-2)}
.pill.interp{color:var(--accent);background:var(--accent-soft)}
.pill.gap{color:var(--bad);background:var(--bad-bg)}

.summary-text{color:var(--ink-2)}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.cond{font-size:12.5px;border:1px solid var(--hair);border-radius:8px;padding:3px 9px;color:var(--ink-2);background:var(--panel)}
.cond.missing{border-style:dashed;color:var(--muted);background:transparent}
.edit{display:flex;flex-direction:column;gap:12px}
.edit label.l{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.edit textarea{width:100%;border:1px solid var(--hair-2);border-radius:10px;padding:9px 12px;background:var(--bg);resize:vertical;min-height:70px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--hair-2);background:var(--bg);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}

.tree{display:flex;flex-direction:column;gap:0;font-size:14px}
.node{display:flex;align-items:center;gap:8px;padding:6px 0}
.node .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--hair-2);flex:none}
.node.l1{padding-left:0}.node.l2{padding-left:22px}.node.l3{padding-left:44px}
.node .lv{font-size:12px;color:var(--muted)}
.node.me{font-weight:600}
.node.me .dot{border-color:var(--accent);background:var(--accent)}
.node.unk .dot{border-style:dashed}
.why{font-size:13.5px;color:var(--ink-2);background:var(--panel);border-radius:10px;padding:10px 12px}
.cases{display:flex;flex-direction:column;gap:6px}
.case{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--hair)}
.case .meta{color:var(--muted);font-size:12.5px;grid-column:1/-1}
.case .exc{grid-column:1/-1;color:var(--warn);font-size:12.5px}

.result-big{display:flex;align-items:flex-start;gap:12px}
.result-big .state{font-size:18px;font-weight:700}
.result-big.yes .state{color:var(--accent)} .result-big.no .state{color:var(--ink)} .result-big.review .state{color:var(--warn)} .result-big.pending .state{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lockup{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid var(--hair);border-radius:10px;background:var(--bg);flex-wrap:wrap}
.lockup .wm{font-weight:700;font-size:20px;color:var(--accent);letter-spacing:-.03em}
.lockup .bar{width:1px;height:20px;background:var(--hair-2)}
.lostyles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lostyle{border:1px solid var(--hair);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);opacity:.6}
.lostyle.on{border-color:var(--accent);opacity:1;box-shadow:0 0 0 1px var(--accent)}
.lostyle b{color:var(--ink);font-size:13.5px}
.lostyle .lockup{padding:12px}
.lockup .svc.indep{font-weight:800;letter-spacing:-.04em;font-size:19px}
.result-big.free .state{color:var(--ink)}
.lockup .svc{font-size:17px;font-weight:600}
.note{font-size:12.5px;color:var(--muted)}

.cands{display:flex;flex-direction:column;gap:12px}
.cand{border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.cand-h{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);flex-wrap:wrap}
.cand-h .name{font-weight:700;font-size:15px}
.cand-h .x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px}
.checks{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:0 12px;font-size:13.5px}
.checks > div{padding:9px 0;border-top:1px solid var(--hair)}
.checks > div:nth-child(-n+3){border-top:0}
.checks .ck{padding-left:14px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.checks .tx{padding-right:14px;color:var(--ink-2)}
.checks .tx .ref{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:4px}
.addc{display:flex;gap:8px}
.addc input{flex:1;min-width:0;border:1px solid var(--hair-2);border-radius:10px;padding:8px 12px;background:var(--bg)}
.forms{display:flex;flex-wrap:wrap;gap:6px}
.forms span{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--hair-2);border-radius:8px;padding:3px 9px;font-weight:600;font-size:13.5px}
.forms i{font-style:normal;font-weight:500;font-size:11.5px;color:var(--muted)}
.verdict-pick{font-weight:600;font-size:15px}
.cand-v{padding:10px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:14px;color:var(--ink)}
.cand.v-ok{border-color:var(--ok)} .cand.v-bad{border-color:var(--bad)} .cand.v-fix{border-color:var(--warn)}
.cand-h .pill{font-size:12.5px}
.cand-d{border-top:1px solid var(--hair)}
.cand-d summary{cursor:pointer;padding:8px 14px;font-size:12.5px;color:var(--muted)}
.cand-d[open] summary{border-bottom:1px solid var(--hair)}
.limit{font-size:12.5px;color:var(--muted);border-left:2px solid var(--hair-2);padding-left:10px}

.basis{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:9px 0;border-top:1px solid var(--hair);font-size:13.5px}
.brow:first-child{border-top:0}
.brow .doc{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brow .bt{grid-column:2;color:var(--ink-2)}
.unk{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.steps b{color:var(--ink);font-weight:600;margin-right:6px}
details.more summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:'+';margin-left:auto;color:var(--muted);font-size:18px;line-height:1}
details.more[open] summary::after{content:'–'}
details.more summary h2{font-size:14px;font-weight:700}

/* 요청 패널 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{padding:18px 22px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:10px}
.dr-h h2{font-size:17px}
.dr-h .ghost{margin-left:auto}
.dr-b{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.dr-f{padding:14px 22px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.field .hint{font-size:12px;color:var(--muted);font-weight:400}
.field input,.field select,.field textarea{border:1px solid var(--hair-2);border-radius:10px;padding:9px 12px;background:var(--raise);width:100%}
.field textarea{resize:vertical;min-height:72px}
.field .ro{border:1px solid var(--hair);border-radius:10px;padding:9px 12px;background:var(--panel);font-size:14px;color:var(--ink-2)}
.field .err{color:var(--bad);font-size:12.5px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.banner{border-radius:10px;padding:11px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-bg);color:var(--ink)}
.banner.bad{background:var(--bad-bg);color:var(--ink)}
.to{display:flex;align-items:center;gap:10px;font-size:13.5px;flex-wrap:wrap}
.to b{font-weight:600}
.sim{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sim select{font-size:12px;border:1px solid var(--hair-2);border-radius:6px;padding:2px 6px;background:var(--raise)}
.receipt{display:flex;flex-direction:column;gap:14px}
.receipt .no{font-family:var(--mono);font-size:20px;font-weight:500}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}

.node.l4{padding-left:66px}
.nms{display:flex;flex-wrap:wrap;gap:6px}
.nm{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--hair-2);border-radius:7px;padding:2px 8px;background:var(--raise);color:var(--ink);white-space:nowrap}
.nm i{font-style:normal;font-size:10.5px;font-weight:600;padding:0 5px;border-radius:4px}
.nm.tadd{border-color:var(--accent)} .nm.tadd i{background:var(--accent);color:var(--accent-ink)}
.nm.tchg{border-color:var(--warn)} .nm.tchg i{background:var(--warn-bg);color:var(--warn)}
.nm.tsup i{background:var(--info-bg);color:var(--info)}
.mapdlg{position:fixed;inset:24px;z-index:21;background:var(--bg);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.mapdlg .dr-h .note{margin-left:4px}
.map-wrap{flex:1;overflow:auto}
.mtx{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:1500px}
.mtx th,.mtx td{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:10px;vertical-align:top;text-align:left}
.mtx thead th{position:sticky;background:var(--panel);z-index:2;font-weight:600}
.mtx thead tr:first-child th{top:0}.mtx thead tr:nth-child(2) th{top:39px;color:var(--muted);font-weight:500}
.mtx .corner{color:var(--muted);font-weight:600;left:0;z-index:3}
.mtx td{min-width:150px}
.mtx td .nm{margin:0 4px 4px 0}
.mtx .grp{writing-mode:vertical-rl;letter-spacing:.2em;font-weight:700;text-align:center;width:36px;position:sticky;left:0;z-index:1}
.g-상시{background:var(--accent-soft);color:var(--accent)} .g-비상시{background:var(--warn-bg);color:var(--warn)} .g-참고{background:var(--info-bg);color:var(--info)}
.mtx .rowh{position:sticky;left:36px;z-index:1;background:var(--panel);width:170px;min-width:170px;font-weight:400}
.mtx .rowh b{display:block;font-size:13.5px;margin:4px 0 2px}
.mtx .rowh span{display:block;color:var(--muted);font-size:11.5px;line-height:1.45}
.lg{display:inline-block!important;font-size:10.5px!important;font-weight:600;padding:1px 6px;border-radius:4px}
.lg.pf{margin-left:4px;background:var(--panel);color:var(--ink-2)!important;border:1px solid var(--hair-2)}
.lg.pf.must{color:var(--ok)!important}.lg.pf.never{color:var(--bad)!important}
.lg.ok{background:var(--ok-bg);color:var(--ok)!important} .lg.no{background:var(--info-bg);color:var(--info)!important}
.mtx tr.myrow .rowh{box-shadow:inset 3px 0 0 var(--accent)}
.mtx th.mecol{color:var(--accent)!important}
.mtx td.me{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px}
.here{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);border:1.5px dashed var(--accent);border-radius:7px;padding:1px 8px}
.map-legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 22px;border-top:1px solid var(--hair)}
@media (max-width:700px){.mapdlg{inset:0;border-radius:0;padding-top:env(safe-area-inset-top,0px)}}
/* 시작 화면: 검색창 하나 */
.landing{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:48px 16px 15vh}
.brandmark{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.035em;text-align:center}
.brandmark span{color:var(--accent)}
.searchbox{width:min(620px,100%);display:flex;align-items:center;gap:8px;border:1px solid var(--hair-2);border-radius:999px;padding:6px 6px 6px 22px;background:var(--raise);transition:box-shadow .15s,border-color .15s}
.searchbox:hover,.searchbox:focus-within{box-shadow:var(--shadow);border-color:var(--hair)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;outline:none}
.searchbox button{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.searchbox button:disabled{background:var(--hair-2);color:var(--muted);cursor:default}
.sugs{width:min(620px,100%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px}

<script>
/* ───────── 기준 데이터: 서비스 카테고리 매트릭스 디벨롭2 (Figma, 2026-10-15 회의 반영) ─────────
   이름 뒤 표시: + 추가 · * 변경 · ~ 보강 (매트릭스 원본의 태그) */
const DOCS={map:{name:'서비스 카테고리 매트릭스',ver:'디벨롭2'},mtg:{name:'10/15 회의',ver:'결정'},tm:{name:'상표 검토 절차',ver:'예시'}};
const ENT={ohouse:'오늘의집',interior:'오늘의집인테리어 (시공)',pay:'오늘의집페이',pb:'오늘의집 PB',retail:'오늘의집 리테일'};
const ENTX={...ENT,unknown:'잘 모르겠어요',other:'기타'};
const TGT={user:'유저',owner:'사장님',creator:'파트너·크리에이터',payer:'결제사'};
const PERIOD={always:'상시',campaign:'기간 한정'};
const CHANNEL={external:'대외 소통 있음',internal:'대내만 (인앱·온드미디어·사내)'};
const INDEP={yes:'독립 브랜드',no:'오늘의집 안에서'};
const COLS=[['ohouse','owner'],['ohouse','creator'],['ohouse','user'],['interior','owner'],['interior','user'],['pay','payer'],['pay','user'],['pb','user'],['retail','user']];
/* prefix: 대외 채널에서 이름 앞 ‘오늘의집’ 표기 — must 필수 · may 선택 · never 불가 · tbd 미정. 대내는 모두 불가 */
const TYPES={
  service:{label:'서비스',group:'상시',logo:true,prefix:'must',desc:'따로 들어가는 입구(독립된 페이지·공간)가 있고, 그곳에서 거래·이용이 일어나요',ask:'독립된 페이지·공간이 있어요'},
  cert:{label:'보증·인증',group:'상시',logo:true,prefix:'must',desc:'상품·업체·사람에 붙는 약속·선별·등급 표시예요',ask:'상품·업체·사람에 붙는 약속이나 표시예요'},
  feature:{label:'기능',group:'상시',logo:false,prefix:'may',desc:'이용자가 앱 안에서 직접 하거나 받는 장치예요 (도구·참여·혜택·리워드)',ask:'앱 안에서 쓰는 도구·혜택·리워드예요'},
  content:{label:'콘텐츠',group:'상시',logo:false,prefix:'tbd',desc:'이용자가 보고 읽는 거예요 (범위 재정리 중)',ask:'보고 읽는 콘텐츠예요'},
  campaign:{label:'기간 운영 캠페인',group:'비상시',logo:null,prefix:'never',desc:'끝나는 날이 있고 정례로 반복되는 캠페인이에요'},
  generic:{label:'앱 일반 명칭',group:'참고',desc:'오늘의집을 붙이기 어색한 일반명사예요'},
  merge:{label:'합치거나 뺄 것',group:'참고',desc:'같은 건 합치고, 단발이거나 고객용이 아니면 빼요'},
};
const PREFIX={must:'대외 표기 필수',may:'대외 표기 선택',never:'표기 불가',tbd:'대외 규칙 미정'};
const KINDS={service:'서비스',cert:'보증·인증',feature:'기능',content:'콘텐츠',unknown:'잘 모르겠어요',other:'기타'};
const TGTX={...{user:'유저',owner:'사장님',creator:'파트너·크리에이터',payer:'결제사'},other:'기타'};
const isUnk=v=>v==='unknown'||v==='other';
const L=k=>{const v=S.svc[k],m={target:TGTX,entity:ENTX,kind:KINDS}[k];return v==='other'?`기타(${S.notes[k]||'직접 입력'})`:m[v]};
const RAW={
  service:{0:'파트너센터|오늘의집 O.rora (표기 통일 필요)*|오하우스애즈|TOPS+',
    1:'콘텐츠수익화|오늘의집 리서치 패널|콜라보마켓|큐레이터 부스터+|크리에이터 플러스|큐레이터|오메이커스|크리에이터|메이트하우스',
    2:'쇼핑|리퍼마켓|오늘의딜|오늘의딜 › 오!마트*|오늘의딜 › 오!쇼룸*|오늘의딜 › LIVE*|오늘의집 설치|무빙패스|공동구매 (비정기→상시)*|특가 코너 (비정기→상시)*|바이너리샵|집구경|집들이',
    3:'건자재몰|사장님센터|사장님센터 아카데미+',
    4:'인테리어/생활|키친|도배|마루|이사|전체시공|부분시공|이사청소·입주청소·인터넷신청·제품설치|오늘의집 구독|인테리어 상담소 / Q&A|오늘의집 스탠다드|라이프서비스+|아파트 시공사례|포트폴리오|시공사례+',
    6:'머니|계좌 간편결제+|상품권 (27.02 예정)*|PLCC (27.04 예정)*',
    7:'layer|layer › 쇼파*|layer › 잠옷*|layer › 데일리*|늘신선|더레인 (The Lane)+|프락트 (FRKT)+|컬렉토리+',
    8:'판교라운지 (인테리어→리테일)*|목동라운지 (인테리어→리테일)*|오늘의집 분당'},
  cert:{1:'스페셜크리에이터|오감리뷰 (프로/루키)',
    2:'원하는날도착|오늘출발|희망일배송|최저가보상제|PICK|Only|특별인증가|오늘의집배송+',
    3:'시공파트너 구독 (라이트·라이트플러스·스탠다드)~',
    4:'책임보장|원가검수|책임시공 (도배)'},
  feature:{2:'오감지수|오집렌즈|3D방꾸미기|선물하기|오늘의집 AI|오늘의가든|행운출첵|친구초대|회원등급 (WELCOME ~ VIP)|첫구매 쿠폰|N-Shot 적립 (12/7 시작)+|숏츠|챌린지|스타일링샷',
    4:'우리동네업체찾기|견적계산기 (3D)|인테리어 계약서 진단|집보기 체크리스트|시공자재 랭킹|업체지도|간편매칭|업체찾기 (= 우리동네업체찾기?)+'},
  content:{},
  campaign:{2:'O!SALE (정기→기간, 매월)*|에디션 (정기→기간, 매월)*|집요한세일|바이너리위크~|살림의달인|로컬의선택|식탁 위 예술|집요한블프~|끝내주는세일·해넘해맞|월간가구세일|이달의키친|새로입주|스페셜 브랜드위크|미식100선|비욘드 라이브러리|월간자취+|오늘의집 디자인어워드+',
    3:'파트너어워즈|시공페스타',4:'100인의 시공일지 (미분류→여기)*|시공반장님 (미분류→여기)*',6:'카드사 결제혜택+'},
  generic:{2:'스크랩|태그|집사진|쇼핑수다|집꾸미기|시공질문|시공정보|BEST|이벤트|챌린지참여'},
  merge:{1:'FTC (뜻 확인)*',2:'가드닝게임 → 오늘의가든 (확인)*|오집가전구독 → 오늘의집 구독*|라이프 바인더 (단발)*|단독 콜라보 (정례 확인)*',4:'시공 (법인)·대고객 아님*'},
};
const ALIAS={'PICK':['픽'],'Only':['온리'],'layer':['레이어'],'BEST':['베스트'],'TOPS':['탑스'],'O!SALE':['오세일'],'LIVE':['라이브']};
const TAGS={'+':'추가','*':'변경','~':'보강'};
const REG=[];
for(const [type,cols] of Object.entries(RAW)) for(const [ci,str] of Object.entries(cols)) str.split('|').forEach(raw=>{
  let tag=null,name=raw;const last=raw.slice(-1);if(TAGS[last]){tag=last;name=raw.slice(0,-1)}
  const base=name.split(' → ')[0].replace(/\s*\(.*\)\s*$/,'').trim();
  const seg=base.split(' › ').pop();
  REG.push({name,base,seg,type,col:+ci,tag,alias:(ALIAS[seg]||[])});
});
const cellOf=(type,col)=>REG.filter(r=>r.type===type&&r.col===col);
const SAMPLE_DESC='고객이 집 사진을 올리면 비슷한 스타일의 상품을 찾아주는 기능이에요. 앱 검색 탭 안에서 상시로 쓰고, 광고에도 소개할 예정이에요.';
const EXAMPLES=[
  {label:'아직 이름이 없어요',text:'새 서비스를 준비 중인데 아직 이름이 없어요. 뭐부터 하면 돼?'},
  {label:'생각해 둔 이름이 있어요',text:'생각해 둔 이름이 있는데 써도 되는지 봐줘.'},
  {label:'지금 쓰는 이름이 궁금해요',text:'다른 팀에서 이미 쓰는 이름인지 궁금해요.'},
  {label:'로고 붙여도 돼요?',text:'새 서비스에 로고를 붙여도 돼?'},
  {label:'‘오늘의집’ 붙여도 돼요?',text:"이름 앞에 '오늘의집'을 붙여도 돼?"},
];

/* ───────── 상태 ───────── */
let S;
function fresh(){return{svc:{summary:null,target:null,entity:null,period:null,channel:null,kind:null,indep:null},candidates:[],notes:{},typing:false,intent:null,awaiting:null,topics:[],msgs:[],editing:false,showGuide:false,draft:null,draftKey:null,requests:{},send:{phase:'idle'}}}
S=fresh();

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const docRef=(k,cl)=>`${DOCS[k].name} ${DOCS[k].ver}${cl?' · '+cl:''}`;

/* ───────── 이해하기: 추출·의도 ───────── */
function extract(t){
  const s=S.svc, found=[];
  const set=(k,v)=>{if(s[k]===null){s[k]=v;found.push(k)}};
  if(/고객|유저|사용자|이용자|회원|소비자/.test(t)) set('target','user');
  if(/사장님|판매자|셀러|입점|시공 ?업체/.test(t)) set('target','owner');
  if(/크리에이터|큐레이터|인플루언서/.test(t)) set('target','creator');
  if(/결제사|카드사/.test(t)) set('target','payer');
  if(/시공|도배|이사|청소|견적/.test(t)) set('entity','interior');
  if(/결제|페이(?!지)|머니|상품권/.test(t)) set('entity','pay');
  if(/PB|자체 ?브랜드|layer|레이어/.test(t)) set('entity','pb');
  if(/오프라인|매장|라운지/.test(t)) set('entity','retail');
  if(/쇼핑|상품|커뮤니티|집들이|콘텐츠|배송|딜|앱/.test(t)) set('entity','ohouse');
  if(/기간|한정|세일|캠페인|매월|시즌|프로모션|페스타|어워드/.test(t)) set('period','campaign');
  if(/상시|계속|정식 운영/.test(t)) set('period','always');
  if(/(독립|전용|별도)(된|적인|의)?[^.,]{0,10}(페이지|공간)/.test(t)) set('kind','service');
  if(/인증|보증|보장|배지|도착|등급 표시|최저가/.test(t)) set('kind','cert');
  if(/기능|도구|계산기|쿠폰|적립|혜택|체크리스트|찾아주|진단|추천/.test(t)) set('kind','feature');
  if(/콘텐츠|영상|아티클|읽을거리|블로그|뉴스/.test(t)) set('kind','content');
  if(/입구|센터|몰|마켓|독립(된)? ?(페이지|공간)|전용 ?(페이지|공간)/.test(t)) set('kind','service');
  if(/사내|임직원|내부 ?(용|커뮤니케이션|행사)|인앱|앱 안에서만|온드 ?미디어/.test(t)) set('channel','internal');
  if(/광고|SNS|인스타|유튜브|보도|언론|제휴|외부|대외|옥외|오프라인 ?홍보/.test(t)) set('channel','external');
  if(/독립 ?브랜드|오늘의집(을|과)? ?(벗어|떼고|없이)/.test(t)) set('indep','yes');
  const q=[...t.matchAll(/[‘'"“]([^’'"”]{1,24})[’'"”]/g)].map(m=>m[1].trim()).filter(x=>x&&x!=='오늘의집'&&!/○/.test(x));
  q.forEach(n=>{if(!S.candidates.includes(n))S.candidates.push(n)});
  return {found,names:q};
}
function classify(t,names){
  if(/상표/.test(t)) return 'trademark';
  if(/로고/.test(t)) return 'logo';
  if(/오늘의집.{0,6}(붙|달|빼)/.test(t)) return 'prefix';
  if(names.length||/후보|어때|써도|괜찮|이미 쓰|쓰고 있|내보내/.test(t)) return 'names';
  if(/뭐부터|어디서부터|시작|처음/.test(t)) return 'start';
  return null;
}

/* ───────── 판단: 위치·로고·후보 ───────── */
function typeKey(){const s=S.svc;if(s.period==='campaign')return'campaign';return s.kind}
function position(){
  const s=S.svc;
  if(!s.target||!s.entity) return null;
  const tk=typeKey();
  const col=isUnk(s.entity)?-1:COLS.findIndex(([e,t])=>e===s.entity&&t===s.target);
  const type=tk&&!isUnk(tk)?TYPES[tk]:null;
  let why;
  if(s.entity==='other') why=`‘${S.notes.entity||'말씀하신 사업'}’에 맞는 사업자 칸이 매트릭스에 없어요. 새 칸이 필요한지 담당 팀 확인이 필요해요.`;
  else if(s.entity==='unknown') why='어느 사업 쪽인지 몰라서 칸을 정하지 못했어요. 담당 팀이 확인해줄 거예요.';

- kind(유형, 상시일 때만, 독립된 페이지·공간이 있으면 service): service=${TYPES.service.desc} / cert=${TYPES.cert.desc} / feature=${TYPES.feature.desc} / content=${TYPES.content.desc}

지금까지 확인한 것: ${JSON.stringify({...S.svc,summary:undefined,candidates:S.candidates})}
방금 사용자에게 한 질문: ${S.awaiting&&FIELD[S.awaiting]?FIELD[S.awaiting]:'없음'}
사용자 메시지: """${text.slice(0,2000)}"""

규칙
- 메시지에서 분명히 알 수 있는 값만 채우고, 모르면 null.
- 정의에 맞는 값이 없으면 "other"로 두고, notes에 그 필드 이름을 키로 사용자 표현을 10자 안팎으로 적어. 예: {"target":"임직원"}
- 대상이 둘 이상이면 주된 하나를 고르고 나머지는 notes.target에 적어.
- "잘 모르겠다"고 하면 entity/kind는 "unknown".
- candidates: 사용자가 검토를 원하는 이름 후보 배열. 따옴표가 없어도 이름이면 넣어. 없으면 [].
- intent: names(이름을 써도 되는지·후보 검토), logo(로고), prefix(이름 앞에 ‘오늘의집’을 붙여도 되는지), trademark(상표), start(어디서부터 할지), info(서비스 설명이나 질문에 대한 답), question(가이드·매트릭스에 대해 묻는 말) 중 하나.
- 표기 기준(답변 근거): 대내에서는 모든 이름 앞에 ‘오늘의집’ 표기 불가. 대외에서는 서비스·보증인증 필수, 기능 선택, 기간 캠페인 불가, 콘텐츠 미정. 로고는 서비스·보증인증만 부착 가능하고, 방식은 워드마크형(오늘의집 워드마크+서비스명) 또는 독립형 두 가지.
- answer: intent가 question일 때만. 위 정의와 표기 기준만 근거로 해요체 2문장 이내. 정의로 답할 수 없으면 "그건 매트릭스에 없어서 담당 팀 확인이 필요해요."
- describes: 메시지가 서비스가 무엇인지 설명하면 true.

형식: {"intent":"info","target":null,"entity":null,"period":null,"channel":null,"kind":null,"indep":null,"notes":{},"candidates":[],"describes":false,"answer":null}`;

function applyAI(r,text){
  if(!r||typeof r!=='object') return false;
  const s=S.svc, aw=S.awaiting;
  for(const k of Object.keys(ALLOWED)){
    const v=r[k];
    if(typeof v==='string'&&ALLOWED[k].includes(v)&&(s[k]===null||aw===k)){s[k]=v;if(r.notes&&r.notes[k])S.notes[k]=String(r.notes[k]).slice(0,30)}
  }
  if(Array.isArray(r.candidates)) r.candidates.map(x=>String(x).trim()).filter(x=>x&&x.length<=24&&x!=='오늘의집').forEach(n=>{if(!S.candidates.includes(n))S.candidates.push(n)});
  if(!s.summary&&(r.describes||aw==='desc')) s.summary=text.split(/후보는|후보:/)[0].trim()||text;
  const it=r.intent;
  if(it==='question'&&r.answer){bot(String(r.answer).slice(0,400));if(S.awaiting){const k=S.awaiting;S.awaiting=null;setTimeout(()=>{ask(k);render()},200)}render();return true}
  if(['names','logo','prefix','trademark','start'].includes(it)) S.intent=it;
  if(!S.intent) S.intent=S.candidates.length?'names':'overview';
  setTimeout(advance,120);render();return true;
}
async function handleUser(text){
  text=text.trim();if(!text||busy)return;
  user(text);
  if(SAMPLE){
    busy=true;S.typing=true;render();
    try{
      const r=await SAMPLE.json(aiPrompt(text),{modelTier:'quick'});
      S.typing=false;busy=false;
      if(applyAI(r,text)) return;
    }catch(e){
      S.typing=false;busy=false;
      if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e&&e.code)) SAMPLE=null;
    }
  }
  ruleBased(text);
}
function ruleBased(text){
  const aw=S.awaiting;
  const {found,names}=extract(text);
  const c=classify(text,names);
  if(aw==='desc'&&!c){S.svc.summary=text}
  else if(aw==='desc'&&c){S.svc.summary=text;S.intent=c}
  else if(c){S.intent=c}
  else if(aw&&aw!=='desc'){
    if(FIELD[aw]&&S.svc[aw]===null){ notUnderstood(aw,text);render();return }
  }
  else if(!S.svc.summary){S.svc.summary=text;S.intent=S.intent||'overview'}
  if(!S.intent)S.intent='overview';
  if(!S.svc.summary&&found.length&&S.intent!=='trademark'){S.svc.summary=text.split(/후보는|후보:/)[0].trim()||text}
  setTimeout(advance,280);render();
}
function notUnderstood(k,text){
  const opts=questionFor(k)[1].filter(o=>o.v!=='other'&&o.v!=='unknown');
  bot(`‘${text.length>20?text.slice(0,20)+'…':text}’만으로는 ${FIELD[k]} 정하지 못했어요.\n가까운 걸 고르거나, 맞는 게 없으면 ‘맞는 게 없어요’를 눌러주세요. 담당 팀이 확인하도록 넘길게요.`,
    [...opts.map(o=>({...o,act:'set',k})),{label:'맞는 게 없어요',act:'set',k,v:'other',note:text.slice(0,30)}]);
}
function onReply(r){
  if(r.act==='fill'){const el=$('#input');el.value=SAMPLE_DESC;el.focus();autoGrow();return}
  if(r.act==='say'){handleUser(r.text);return}
  if(r.act==='ex'){handleUser(r.text);return}
  if(r.act==='set'){user(r.label);S.svc[r.k]=r.v;if(r.note)S.notes[r.k]=r.note;else if(r.v==='other')delete S.notes[r.k];setTimeout(advance,220);render();return}
  if(r.act==='intent'){user(r.label);S.intent=r.v;setTimeout(advance,220);render();return}
}

function verdict(n){
  const p=position(), m=matchName(n), core=coreOf(n), hasBrand=/^오늘의집/.test(n), nc=norm(core);
  const col=p?p.col:-1;
  const merge=m.exact.find(r=>r.type==='merge');
  if(merge) return {v:'bad',label:'쓰면 안 돼요',reason:`매트릭스에서 정리 대상으로 표시된 이름이에요: ${merge.name}`};
  const ex=m.exact.filter(r=>r.type!=='merge');
  if(ex.length) return {v:'bad',label:'쓰면 안 돼요',reason:`이미 쓰고 있는 이름이에요: ‘${ex[0].name}’(${placeOf(ex[0])})`};
  const formsOf=r=>[norm(r.base),norm(coreOf(r.base)),norm(r.seg)];
  const same=[...m.alias,...m.sim.filter(r=>formsOf(r).some(f=>nc.length>1&&(f.includes(nc)||nc.includes(f))))].filter(r=>r.col===col);
  if(same.length) return {v:'bad',label:'쓰면 안 돼요',reason:`같은 칸에 사실상 같은 이름이 있어요: ‘${same[0].name}’. 고객이 같은 걸로 알기 쉬워요.`};
  if(!p||col<0||!p.type) return {v:'review',label:'담당 팀 확인이 필요해요',reason:'매트릭스에서 들어갈 칸을 찾지 못해서 판단할 기준이 없어요.'};
  if(p.tk==='content') return {v:'review',label:'담당 팀 확인이 필요해요',reason:'콘텐츠는 분류 범위와 대외 표기 규칙을 다시 정리하고 있어요. 담당 팀에 확인해주세요.'};
  const fixes=[];let fixTo=null;
  if(p.tk==='campaign'&&hasBrand){fixes.push('기간 캠페인에는 ‘오늘의집’을 붙이지 않아요.');fixTo=core}
  if(GENERIC.includes(nc)&&hasBrand){fixes.push('일반명사라 ‘오늘의집’을 빼야 해요.');fixTo=core}
  if(/[가-힣][A-Za-z]|[A-Za-z][가-힣]/.test(core)) fixes.push('한글과 영문이 붙어 있어요. 하나로 통일해주세요.');
  const near=m.sim.filter(r=>r.col===col&&!same.includes(r));
  if(near.length) fixes.push(`같은 칸의 ‘${near[0].name}’${jo(near[0].base,'과','와')} 헷갈릴 수 있어요. 겹치는 말을 바꿔주세요.`);
  const forms=nameForms(fixTo||n);
  const note=/패스|멤버십|클럽|구독/.test(n)?'멤버십·패스 이름 규칙은 아직 정리 중이에요.':'';
  if(fixes.length) return {v:'fix',label:'고쳐서 쓰세요',reason:fixes.join(' '),fixTo,forms,note};
  return {v:'ok',label:'써도 돼요',reason:'매트릭스 기준에 걸리는 게 없어요. 출시 전에 상표만 따로 확인해주세요.',forms,note};
}
const VPILL={ok:'ok',fix:'fix',bad:'bad',review:'review'};

  const vs=S.candidates.map(n=>[n,verdict(n)]);
  const ok=vs.find(([,v])=>v.v==='ok'), fx=vs.find(([,v])=>v.v==='fix');
  const pick=ok?`바로 쓸 수 있는 이름은 ‘${ok[0]}’${jo(ok[0],'이에요','예요')}.`:fx?`그대로 쓸 수 있는 이름은 없어요. ‘${fx[0]}’${jo(fx[0],'은','는')} 고치면 쓸 수 있어요.`:vs.some(([,v])=>v.v==='review')?'매트릭스만으로는 정할 수 없어서 담당 팀 확인이 필요해요.':'지금 후보 중에는 쓸 수 있는 이름이 없어요. 새 후보를 알려주세요.';
  return {vs,pick};
}

const condKey=()=>JSON.stringify([S.svc,S.candidates]);
function buildDraft(type){
  const r=logoResult(),p=position(),s=S.svc;

  if(type==='review') unk.unshift(r.reason);
  unk.push('상표 확인 전');
  return{type,name:S.candidates[0]||'',nameState:S.candidates.length?'후보':'미정',summary:s.summary||'',tier:p?p.path:'위치 미정',

    where:'',date:'',link:'',unknowns:unk.join('\n'),
    key:'req_'+Math.random().toString(36).slice(2,10),errors:{}};
}
let drawerOpen=null, notice='';
function openDrawer(type){
  if(S.requests[type]){drawerOpen=type;S.send={phase:'done'};renderDrawer();return}

  notice='';
  if(S.draft&&S.draft.type===type&&S.draftKey===k){/* 수정한 초안 유지 */}
  else{ if(S.draft&&S.draftKey!==k) notice='서비스 조건이 바뀌어서 요청 내용을 다시 만들었어요. 바뀐 내용을 확인해주세요.'; S.draft=buildDraft(type);S.draftKey=k}
  S.send={phase:'idle'};drawerOpen=type;renderDrawer();
  setTimeout(()=>{const f=$('#drawerRoot [data-first]');f&&f.focus()},30);
}

  const d=S.draft;if(!d)return;
  ['name','nameState','summary','where','date','link','unknowns'].forEach(f=>{const el=document.getElementById('f_'+f);if(el)d[f]=el.value});
}
function validate(){
  const d=S.draft,e={};
  if(!d.summary.trim())e.summary='어떤 서비스인지 적어주세요.';
  if(!d.where.trim())e.where='어디에 쓰는지 적어주세요. 예: 앱 검색 탭, 광고';
  if(d.type==='make'&&!d.name.trim())e.name='임시 이름이라도 적어주세요.';
  d.errors=e;return!Object.keys(e).length;
}
function send(){
  syncDraft();
  if(S.send.phase==='sending'||S.send.phase==='checking')return; // 연속 클릭 방지
  if(!validate()){renderDrawer();return}
  const outcome=$('#simSel')?$('#simSel').value:'success';
  S.send={phase:'sending',outcome};renderDrawer();
  if(outcome==='fail'){setTimeout(()=>{S.send={phase:'failed'};S.sim='success';renderDrawer()},1100);return}
  if(outcome==='timeout'){
    setTimeout(()=>{S.send={phase:'checking'};renderDrawer();
      setTimeout(()=>{finish(true)},1400)},2000);return}
  setTimeout(()=>finish(false),1100);
}
function finish(recovered){
  const d=S.draft;
  const no='BD-2610-'+String(140+Object.keys(S.requests).length+1).padStart(4,'0');
  const now=new Date();
  S.requests[d.type]={no,at:`2026-10-15 ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,recovered,key:d.key,draft:{...d}};
  S.send={phase:'done'};S.sim='success';
  bot(`요청을 보냈어요. 요청 번호: ${no}\n담당 팀이 보고 연락드릴 거예요. 아직 ${d.type==='make'?'만들기로 정해진':'결정된'} 건 아니에요.`);

}

function relogo(before){
  const after=logoResult().label;
  if(S.topics.includes('logo')&&before!==after) bot(`내용이 바뀌어서 다시 봤어요. 로고: ${before} → ${after}`);
  else if(S.topics.length) bot('내용이 바뀌어서 결과를 다시 봤어요.');
}
$('#panel').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='editBtn'||t.id==='editBtn2'){S.editing=true;renderPanel();return}
  if(t.id==='doneEdit'){const v=$('#sumEdit').value.trim();if(v&&v!==S.svc.summary){S.svc.summary=v}S.editing=false;render();return}
  if(t.dataset.edit){
    const k=t.dataset.edit,v=t.dataset.v;
    const sumEl=$('#sumEdit');if(sumEl)S.svc.summary=sumEl.value.trim()||S.svc.summary;
    if(S.svc[k]===v)return;
    const before=logoResult().label;S.svc[k]=v;relogo(before);render();return}
  if(t.id==='guideBtn'){S.showGuide=!S.showGuide;renderPanel();return}
  if(t.id==='objectBtn'){bot('어떤 점이 다른지 알려주세요. 내용을 고치면 다시 볼게요. 애매하면 담당 팀에 물어볼 수도 있어요.',[{label:'내용 고치기',act:'editPanel'},{label:'담당 팀에 물어보기',act:'openReview'}]);renderThread();return}
  if(t.id==='mapBtn'){openMap();return}
  if(t.dataset.open){openDrawer(t.dataset.open);return}
  if(t.dataset.try){const v=t.dataset.try;if(!S.candidates.includes(v))S.candidates.push(v);render();return}
  if(t.dataset.rm){S.candidates.splice(+t.dataset.rm,1);if(!S.candidates.length)S.topics=S.topics.filter(x=>x!=='names');render();return}
});

  const r=S.msgs[+b.dataset.m].replies[+b.dataset.r];
  if(+b.dataset.m!==S.msgs.length-1)return;
  if(r.act==='editPanel'){S.editing=true;renderPanel();document.querySelector('.panel').scrollTo({top:0,behavior:'smooth'});return}
  if(r.act==='openReview'){openDrawer('review');return}
  onReply(r);
});
function autoGrow(){const el=$('#input');el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px'}
$('#input').addEventListener('input',autoGrow);
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#composer').requestSubmit()}});
$('#composer').addEventListener('submit',e=>{e.preventDefault();if(busy)return;const el=$('#input');const v=el.value;el.value='';autoGrow();handleUser(v)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawerOpen)closeDrawer()});
$('#resetBtn').addEventListener('click',()=>{S=fresh();drawerOpen=null;$('#drawerRoot').innerHTML='';const li=$('#landIn');li.value='';$('#landGo').disabled=true;render();li.focus()});

/* 전체 매트릭스 */
function openMap(){
  const p=position(), myCol=p?p.col:-1, myType=p?p.tk:null;
  const ents=[];COLS.forEach(([e])=>{const l=ents[ents.length-1];if(l&&l[0]===e)l[1]++;else ents.push([e,1])});
  const rows=['service','cert','feature','content','campaign','generic','merge'];
  const groups={상시:4,비상시:1,참고:2};let lastG=null;
  const body=rows.map(t=>{const T=TYPES[t];const g=T.group;const gcell=g!==lastG?`<th class="grp g-${g}" rowspan="${groups[g]}">${g}</th>`:'';lastG=g;
    const logo=(T.logo===true?'<span class="lg ok">로고 부착 가능</span>':T.logo===false?'<span class="lg no">로고 부착 불가</span>':'')+(T.prefix?`<span class="lg pf ${T.prefix}">${PREFIX[T.prefix]}</span>`:'');
    return`<tr class="${t===myType?'myrow':''}">${gcell}<th class="rowh">${logo}<b>${esc(T.label)}</b><span>${esc(T.desc)}</span></th>${COLS.map((c,ci)=>`<td class="${t===myType&&ci===myCol?'me':''}">${cellOf(t,ci).map(chip).join('')}${t===myType&&ci===myCol?'<span class="here">이번 서비스</span>':''}</td>`).join('')}</tr>`}).join('');
  $('#mapRoot').innerHTML=`<div class="scrim" data-mclose></div><div class="mapdlg" role="dialog" aria-modal="true" aria-label="서비스 카테고리 매트릭스">
  <div class="dr-h"><h2>서비스 카테고리 매트릭스</h2><span class="note">디벨롭2 · 이름 ${REG.length}개</span><button class="ghost" type="button" data-mclose>닫기</button></div>
  <div class="map-wrap"><table class="mtx"><thead>
    <tr><th colspan="2" class="corner">사업자</th>${ents.map(([e,n])=>`<th colspan="${n}" class="ent">${esc(ENT[e])}</th>`).join('')}</tr>
    <tr><th colspan="2" class="corner">대상</th>${COLS.map(([,t],ci)=>`<th class="tgt ${ci===myCol?'mecol':''}">${esc(TGT[t])}</th>`).join('')}</tr>
  </thead><tbody>${body}</tbody></table></div>
  <div class="map-legend"><span class="note"><b>오늘의집 표기</b> 대내(인앱·온드미디어·사내)는 모든 이름 앞에 표기 불가 · 대외는 줄마다 표시된 규칙을 따라요.</span><span class="nm tadd">이름<i>추가</i></span><span class="nm tchg">이름<i>변경</i></span><span class="nm tsup">이름<i>보강</i></span><span class="note">매트릭스 원본에 표시된 정리 상태예요.</span></div>
  </div>`;
  document.querySelectorAll('#mapRoot [data-mclose]').forEach(b=>b.addEventListener('click',closeMap));
  const me=$('#mapRoot td.me');me&&me.scrollIntoView({block:'center',inline:'center'});
  $('#mapRoot .ghost').focus();
}
function closeMap(){$('#mapRoot').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mapRoot').innerHTML)closeMap()});

/* 시작 화면 */
$('#sugs').innerHTML=EXAMPLES.map((e,i)=>`<button type="button" data-ex="${i}" title="${esc(e.text)}">${esc(e.label)}</button>`).join('');
function start(text){if(!text.trim())return;handleUser(text);setTimeout(()=>$('#input').focus(),50)}
$('#sugs').addEventListener('click',e=>{const b=e.target.closest('[data-ex]');if(b)start(EXAMPLES[+b.dataset.ex].text)});
$('#landIn').addEventListener('input',e=>{$('#landGo').disabled=!e.target.value.trim()});
$('#landIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.isComposing)e.preventDefault()});
$('#landForm').addEventListener('submit',e=>{e.preventDefault();start($('#landIn').value)});
render();$('#landIn').focus();
</script>
